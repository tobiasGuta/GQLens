name: Publish GQLens v0.1.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gqlens-v0.1.0-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'tobiasGuta/GQLens' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test installable extension
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Verify packaged extension
        shell: bash
        run: |
          set -euo pipefail
          test -s target/GQLens-0.1.0.jar
          jar tf target/GQLens-0.1.0.jar | grep -Fx 'burp/BurpExtender.class'
          if jar tf target/GQLens-0.1.0.jar | grep -E '^burp/api/montoya/' > /dev/null; then
            echo "Montoya API must be provided by Burp, not bundled" >&2
            exit 1
          fi
          sha256sum target/GQLens-0.1.0.jar
      - name: Publish GitHub Release and attach JAR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "::error::v0.1.0 already exists. Do not silently replace a published release."
            exit 1
          fi
          cat > RELEASE_NOTES.md <<'NOTES'
          GQLens v0.1.0 is the first **passive GraphQL request inventory** for Burp Suite Community Edition.

          Download **GQLens-0.1.0.jar** below, then load it via **Burp > Extensions > Installed > Add > Java**.

          - Captures only new requests inside your configured Burp Target scope
          - Parses observed GraphQL operations, selected field paths, and fragments
          - Includes a searchable inventory, duplicate counts, and JSON metadata export
          - Does not launch probes, run Burp Scanner, or execute GraphQL mutations

          **Early prototype:** This build passes automated tests and packaging checks; manual loading in the Burp desktop application is still recommended. No active schema enumeration is included yet.
          NOTES
          gh release create v0.1.0 target/GQLens-0.1.0.jar \
            --target "$GITHUB_SHA" \
            --title "GQLens v0.1.0" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
