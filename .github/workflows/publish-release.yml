name: Publish GQLens tagged release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: gqlens-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'tobiasGuta/GQLens' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check tag matches Maven version and is not already released
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(mvn --batch-mode --no-transfer-progress -q help:evaluate -Dexpression=project.version -DforceStdout)"
          test "$GITHUB_REF_NAME" = "v${VERSION}" || { echo 'Tag and Maven version differ' >&2; exit 1; }
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'Published release already exists; refusing to overwrite' >&2
            exit 1
          fi
          echo "GQLENS_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Verify JAR and produce SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/GQLens-${GQLENS_VERSION}.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep -Fx 'burp/BurpExtender.class'
          if jar tf "$JAR" | grep -q '^burp/api/montoya/'; then
            echo 'Montoya API must be provided by Burp, not bundled' >&2
            exit 1
          fi
          (cd target && sha256sum "GQLens-${GQLENS_VERSION}.jar" > "GQLens-${GQLENS_VERSION}.jar.sha256")
      - name: Publish versioned release from existing tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ "$GQLENS_VERSION" == *-* ]]; then EXTRA+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            "target/GQLens-${GQLENS_VERSION}.jar" \
            "target/GQLens-${GQLENS_VERSION}.jar.sha256" \
            --verify-tag --title "GQLens $GITHUB_REF_NAME" --generate-notes "${EXTRA[@]}"
