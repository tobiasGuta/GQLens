name: Publish GQLens Bug Bounty Workspace beta

on:
  push:
    branches:
      - feat/bug-bounty-workspace-beta8
    paths:
      - .github/workflows/publish-bounty-beta.yml

permissions:
  contents: write

concurrency:
  group: gqlens-bug-bounty-workspace-beta
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'tobiasGuta/GQLens' && github.ref == 'refs/heads/feat/bug-bounty-workspace-beta8'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature commit
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check Maven version and exclusive beta tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(mvn -q --batch-mode --no-transfer-progress help:evaluate -Dexpression=project.version -DforceStdout)"
          test "$VERSION" = '0.2.0-beta.8' || { echo 'Expected beta.8 version' >&2; exit 1; }
          TAG="v${VERSION}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo 'Refusing to overwrite existing release tag' >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Refusing to overwrite published release' >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Build and test JAR
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Validate Burp entrypoint and checksum
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/GQLens-${VERSION}.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep -Fx 'burp/BurpExtender.class'
          if jar tf "$JAR" | grep -q '^burp/api/montoya/'; then
            echo 'Montoya API must not be bundled' >&2
            exit 1
          fi
          (cd target && sha256sum "GQLens-${VERSION}.jar" > "GQLens-${VERSION}.jar.sha256")
      - name: Publish beta JAR and checksum without replacing older tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<'NOTES'
          GQLens v0.2.0-beta.8: opt-in controlled GraphQL schema reconnaissance and improved evidence explorer.

          - Explicit, bounded, in-scope read-only import of existing Burp Proxy history.
          - Session-level import deduplication and metadata-only GraphQL response correlation.
          - Analyst-owned cases, research notes, verification states, user-created test-context labels,
            and capture-to-context association without inspecting credentials.
          - An investigation candidate queue derived from observed response errors and
            available schema/request discrepancies, with visible missing-proof requirements.
          - Evidence-to-case attachments and navigation back to session-local capture history.
          - No application field-name wordlists, automatic vulnerability claims, live target
            probing, or raw HTTP retention. Existing opt-in introspection unchanged.
          - Automated tests for import bounds, privacy, batch isolation, investigation state
            and native Swing workspace composition.

          **Development prerelease.** Automated tests passed. Manual Burp Community validation of the history import and new case/candidate interactions remains necessary.
          Verify the downloaded JAR using the attached SHA-256 checksum.
          NOTES
          gh release create "$TAG" \
            "target/GQLens-${VERSION}.jar" \
            "target/GQLens-${VERSION}.jar.sha256" \
            --target "$GITHUB_SHA" --title "GQLens $TAG" \
            --notes-file RELEASE_NOTES.md --prerelease
      - name: Verify new prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --json tagName,isPrerelease,assets,url
