name: Build GQLens JAR

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21 and Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Verify Burp entry point is packaged
        run: |
          test -s target/GQLens-0.1.0.jar
          jar tf target/GQLens-0.1.0.jar | grep -Fx burp/BurpExtender.class
          if jar tf target/GQLens-0.1.0.jar | grep -q '^burp/api/montoya/'; then
            echo "Montoya API must not be bundled" >&2
            exit 1
          fi
      - name: Upload downloadable extension JAR
        uses: actions/upload-artifact@v4
        with:
          name: GQLens-v0.1.0-burp-community
          path: target/GQLens-0.1.0.jar
          if-no-files-found: error
          retention-days: 30
